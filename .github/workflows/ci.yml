name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Fijar versión de npm
        run: npm install --global npm@10.9.4

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run test:ci

      - name: Configurar Java para Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Ejecutar pruebas de reglas Firestore
        run: npm run test:rules

      - name: Guardar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jest
          path: coverage/
          if-no-files-found: error
